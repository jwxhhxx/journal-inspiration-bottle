<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手账灵感瓶 · 给画师的每日灵感</title>
<style>
  :root {
    --bg: #fdf3ea;
    --bg2: #ffe9f2;
    --ink: #6b4f3f;
    --ink-soft: #9a7e6c;
    --pink: #ff9eb5;
    --pink-deep: #f4728f;
    --blue: #a8d8ea;
    --yellow: #ffd97d;
    --mint: #b8e6c9;
    --lilac: #d5c6f2;
    --card: #fffdf9;
    --shadow: rgba(160, 110, 90, .18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, var(--bg2) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #e8f4ff 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .float-deco { position: fixed; font-size: 26px; opacity: .55; animation: floaty 6s ease-in-out infinite; pointer-events: none; z-index: 1; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-18px) rotate(6deg); } }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; position: relative; z-index: 2; }

  header { text-align: center; margin-bottom: 24px; }
  h1 {
    font-size: 44px; letter-spacing: 4px; color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(244,114,143,.2);
  }
  h1 .tilt { display: inline-block; transform: rotate(-4deg); }
  .subtitle { margin-top: 10px; color: var(--ink-soft); font-size: 15px; }
  .subtitle b { color: var(--pink-deep); }

  .main { display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

  /* ===== 瓶子区 ===== */
  .bottle-zone {
    background: var(--card); border-radius: 32px; padding: 24px 24px 18px;
    box-shadow: 0 12px 40px var(--shadow), inset 0 0 0 3px #ffe1d6;
    text-align: center; width: 470px; position: relative;
  }
  .bottle-zone h2 { font-size: 20px; margin-bottom: 6px; color: var(--ink); }
  .hint { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .bottle-count { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }
  .bottle-count b { color: var(--pink-deep); }

  /* 元素类型选择 */
  .cat-title { font-size: 15px; font-weight: bold; color: var(--ink); margin: 14px 0 8px; }
  .cat-title small { font-weight: normal; color: var(--ink-soft); font-size: 12px; }
  .cat-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cat-chip {
    padding: 7px 15px; border-radius: 999px; font-size: 13.5px; cursor: pointer; user-select: none;
    background: #fff; color: var(--ink-soft); border: 2px solid #f0dcc9;
    transition: all .15s; font-weight: bold;
  }
  .cat-chip:hover { transform: translateY(-2px); border-color: var(--pink); }
  .cat-chip.on {
    background: linear-gradient(135deg, #ffe1ea, #ffd6e3); color: #e0517a;
    border-color: var(--pink-deep); box-shadow: 0 3px 0 rgba(244,114,143,.25);
  }
  .cat-chip.on[data-cat="食物"] { background: #fff3d1; color: #c08a1e; border-color: #e8b04a; box-shadow: 0 3px 0 rgba(232,176,74,.25); }
  .cat-chip.on[data-cat="水果"] { background: #ffe1e1; color: #e05d5d; border-color: #f08a8a; box-shadow: 0 3px 0 rgba(240,138,138,.25); }
  .cat-chip.on[data-cat="植物"] { background: #ddf5e5; color: #3d9b62; border-color: #7fcf9f; box-shadow: 0 3px 0 rgba(127,207,159,.25); }
  .cat-chip.on[data-cat="动物"] { background: #dff1fa; color: #3d8fb5; border-color: #8cc4e0; box-shadow: 0 3px 0 rgba(140,196,224,.25); }
  .cat-chip.on[data-cat="盐系小元素"] { background: #f0f0f0; color: #777; border-color: #bbb; box-shadow: 0 3px 0 rgba(160,160,160,.25); }
  .cat-chip.on[data-cat="日常用品"] { background: #ece4fb; color: #8263d0; border-color: #b9a3ec; box-shadow: 0 3px 0 rgba(185,163,236,.25); }
  .cat-chip.on[data-cat="天空与天气"] { background: #e2f0ff; color: #4a7fc1; border-color: #93bdec; box-shadow: 0 3px 0 rgba(147,189,236,.25); }
  .cat-chip.on[data-cat="节日限定"] { background: #ffe6d9; color: #e07a3d; border-color: #f0a876; box-shadow: 0 3px 0 rgba(240,168,118,.25); }
  .cat-chip.small { padding: 5px 14px; font-size: 13px; }
  .num-chip {
    width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; user-select: none;
    background: #fff; color: var(--ink-soft); border: 2px solid #f0dcc9; transition: all .15s;
  }
  .num-chip:hover { transform: translateY(-2px); border-color: var(--pink); }
  .num-chip.on {
    background: linear-gradient(135deg, var(--yellow), #ffc94d); color: #8a6410;
    border-color: #e8b04a; box-shadow: 0 3px 0 rgba(232,176,74,.3);
  }

  /* 自定义元素 */
  .custom-box { margin-top: 12px; border-top: 2px dashed #f0dcc9; padding-top: 8px; }
  .custom-row { display: flex; gap: 6px; margin-top: 6px; }
  .custom-row select {
    flex: 0 0 108px; padding: 7px 6px; border-radius: 10px; border: 2px solid #f0dcc9;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
  }
  .custom-row input {
    flex: 1; min-width: 0; padding: 7px 10px; border-radius: 10px; border: 2px solid #f0dcc9;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
  }
  .custom-row input:focus, .custom-row select:focus { border-color: var(--pink); }
  .btn-tiny {
    flex: 0 0 40px; background: var(--mint); color: #2f7a52; font-size: 17px;
    padding: 0; border-radius: 12px; box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }
  .custom-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  .custom-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff7e8; border: 1.5px solid #f0cf9a; color: #b07b1e;
    padding: 3px 6px 3px 10px; border-radius: 999px; font-size: 12px; font-weight: bold;
  }
  .custom-tag button {
    border: none; background: none; color: #d09a3e; cursor: pointer; font-size: 13px;
    padding: 0 3px; line-height: 1;
  }
  .custom-tag button:hover { color: #e0517a; }
  .custom-empty { font-size: 12px; color: #c9b29a; margin-top: 4px; }

  /* 元素库弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(90,60,45,.35); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 100;
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .elem-modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-46%) scale(.95); opacity: 0;
    width: 620px; max-width: 94vw; max-height: 84vh;
    background: var(--bg); border-radius: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25), inset 0 0 0 3px #ffe1d6;
    z-index: 110; display: flex; flex-direction: column; pointer-events: none;
    transition: transform .3s cubic-bezier(.3,1.2,.4,1), opacity .3s;
  }
  .elem-modal.show { transform: translate(-50%,-50%) scale(1); opacity: 1; pointer-events: auto; }
  .elem-head { padding: 20px 22px 10px; display: flex; justify-content: space-between; align-items: center; }
  .elem-head h3 { font-size: 20px; color: var(--pink-deep); }
  .elem-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 22px 10px; }
  .elem-tab {
    padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: bold; cursor: pointer;
    border: 2px solid #f0dcc9; background: #fff; color: var(--ink-soft); transition: all .15s;
  }
  .elem-tab:hover { border-color: var(--pink); }
  .elem-tab.on { background: var(--pink); border-color: var(--pink-deep); color: #fff; }
  .elem-addbar { display: flex; gap: 6px; padding: 0 22px 12px; }
  .elem-addbar select {
    flex: 0 0 120px; padding: 7px 6px; border-radius: 10px; border: 2px solid #f0dcc9;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
  }
  .elem-addbar input {
    flex: 1; min-width: 0; padding: 7px 10px; border-radius: 10px; border: 2px solid #f0dcc9;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
  }
  .elem-addbar input:focus, .elem-addbar select:focus { border-color: var(--pink); }
  .elem-count { font-size: 12px; color: var(--ink-soft); padding: 0 24px 6px; }
  .elem-list {
    flex: 1; overflow-y: auto; padding: 2px 22px 20px;
    display: flex; flex-wrap: wrap; gap: 7px; align-content: flex-start;
  }
  .elem-pill { background: #fff; border: 1.5px solid #eadbc8; color: var(--ink); padding: 4px 11px; border-radius: 999px; font-size: 12.5px; }
  .elem-pill.custom {
    background: #fff7e8; border-color: #f0cf9a; color: #b07b1e; font-weight: bold;
    display: inline-flex; gap: 4px; align-items: center;
  }
  .elem-pill.custom button { border: none; background: none; color: #d09a3e; cursor: pointer; font-size: 13px; padding: 0; line-height: 1; }
  .elem-pill.custom button:hover { color: #e0517a; }

  /* 纸条：已完成 / 粉碎 */
  .history-card .btns { display: flex; gap: 6px; margin-top: 10px; }
  .hbtn {
    border: 1.5px solid #e3c1ae; background: #fff; color: #b5714e; border-radius: 999px;
    font-size: 11.5px; padding: 4px 12px; cursor: pointer; font-family: inherit; font-weight: bold;
  }
  .hbtn:hover { background: #fff0e6; }
  .hbtn.done-btn.on { background: #ddf5e5; border-color: #7fcf9f; color: #2f7a52; }
  .hbtn.shred-btn { border-color: #f0b6c4; color: #e0517a; }
  .hbtn.shred-btn:hover { background: #ffe1ea; }
  .done-badge { background: #ddf5e5; color: #2f7a52; border-radius: 999px; font-size: 11px; padding: 2px 8px; font-weight: bold; }
  .history-card.done { opacity: .68; }
  .history-card.done .text { text-decoration: line-through; }
  .history-card.shredding { animation: shred .45s ease forwards; pointer-events: none; }
  @keyframes shred {
    40% { transform: scale(1.06) rotate(2deg); opacity: 1; filter: blur(0); }
    100% { transform: scale(.2) rotate(-16deg); opacity: 0; filter: blur(4px); }
  }
  .strip-in-bottle.done { opacity: .45; filter: grayscale(.8); text-decoration: line-through; }

  .bottle-stage {
    position: relative; height: 340px; display: flex; align-items: center;
    justify-content: center; margin-top: 4px;
  }
  #bottleSvg { cursor: pointer; transition: transform .3s; flex: 0 0 auto; }
  #bottleSvg:hover { transform: scale(1.03); }
  #bottleSvg.shaking { animation: shake .6s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(0); } 15% { transform: rotate(-7deg) translateY(-6px); }
    35% { transform: rotate(6deg); } 55% { transform: rotate(-5deg) translateY(-3px); }
    75% { transform: rotate(4deg); }
  }
  /* 纸条摆在瓶子左右的空白处 */
  .strip-in-bottle {
    position: absolute; width: 64px; padding: 7px 5px; border-radius: 4px;
    font-size: 10.5px; line-height: 1.3; text-align: center; color: #7a5c48;
    box-shadow: 0 2px 6px rgba(0,0,0,.14); word-break: break-all;
    cursor: pointer; transition: transform .2s, box-shadow .2s; white-space: pre-line;
  }
  .strip-in-bottle.compact { font-size: 9.5px; line-height: 1.25; padding: 5px 4px; border-radius: 3px; }
  .strip-in-bottle:hover { transform: scale(1.12) rotate(-3deg) !important; z-index: 30; box-shadow: 0 6px 16px rgba(0,0,0,.22); }
  .strip-fly { animation: flyIn 1s ease-in forwards; }
  @keyframes flyIn {
    0% { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(2.2) rotate(-14deg); opacity: 0; z-index: 50; }
    25% { opacity: 1; }
    100% { opacity: 1; z-index: 50; }
  }

  .sparkle { position: fixed; pointer-events: none; z-index: 60; animation: sparkleAnim .8s ease-out forwards; }
  @keyframes sparkleAnim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.6) translateY(-30px); opacity: 0; } }

  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: bold;
    border-radius: 999px; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .btn-shake {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff; font-size: 19px; padding: 15px 44px; letter-spacing: 2px; margin-top: 10px;
  }
  .btn-small {
    background: #fff; color: var(--pink-deep); font-size: 13px;
    padding: 8px 18px; border: 2px dashed var(--pink);
  }

  /* ===== 结果卡片区 ===== */
  .result-zone { width: 520px; max-width: 100%; }
  .result-card {
    background: var(--card); border-radius: 28px; padding: 26px;
    box-shadow: 0 12px 40px var(--shadow), inset 0 0 0 3px #d6ecd9;
    display: none; position: relative;
  }
  .result-card.show { display: block; animation: popIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { 0% { transform: scale(.7) rotate(-3deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .tag.pink { background: #ffe1ea; color: #e0517a; }
  .tag.blue { background: #dff1fa; color: #3d8fb5; }
  .tag.mint { background: #ddf5e5; color: #3d9b62; }
  .tag.lilac { background: #ece4fb; color: #8263d0; }

  #descText {
    font-size: 15.5px; line-height: 2; color: var(--ink);
    background: repeating-linear-gradient(transparent, transparent 29px, #ffe9e9 29px, #ffe9e9 30px);
    padding: 4px 6px; min-height: 120px; white-space: pre-wrap;
  }
  #descText .line-label { color: var(--pink-deep); font-weight: bold; }
  .result-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn-copy { background: var(--mint); color: #2f7a52; font-size: 14px; padding: 10px 22px; }
  .btn-again { background: var(--lilac); color: #6a4dbb; font-size: 14px; padding: 10px 22px; }

  .empty-tip {
    background: rgba(255,255,255,.7); border: 2px dashed #f3c9b8; border-radius: 28px;
    padding: 60px 30px; text-align: center; color: var(--ink-soft); font-size: 15px; line-height: 2;
  }
  .empty-tip .big { font-size: 44px; display: block; margin-bottom: 8px; }

  #toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: var(--ink); color: #fff; padding: 10px 26px; border-radius: 999px;
    font-size: 14px; transition: transform .35s; z-index: 100;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 历史抽屉 ===== */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(90,60,45,.35); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 80;
  }
  .drawer-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: -460px; width: 430px; max-width: 92vw; height: 100vh;
    background: var(--bg); box-shadow: -8px 0 40px rgba(0,0,0,.18);
    transition: right .35s cubic-bezier(.3,1.2,.4,1); z-index: 90;
    display: flex; flex-direction: column;
  }
  .drawer.show { right: 0; }
  .drawer-head {
    padding: 22px 24px 14px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px dashed #eec9b6;
  }
  .drawer-head h3 { font-size: 20px; color: var(--pink-deep); }
  .drawer-close {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: #ffd9c9; color: #c25b3a; font-size: 17px; font-weight: bold;
  }
  .drawer-list { flex: 1; overflow-y: auto; padding: 18px 20px 30px; }
  .history-card {
    background: #fffdf9; border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 4px 14px var(--shadow); border-left: 6px solid var(--pink);
    animation: popIn .4s ease;
  }
  .history-card:nth-child(4n+2) { border-left-color: var(--blue); }
  .history-card:nth-child(4n+3) { border-left-color: var(--yellow); }
  .history-card:nth-child(4n) { border-left-color: var(--mint); }
  .history-card .meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .history-card .text { font-size: 13.5px; line-height: 1.9; color: var(--ink); white-space: pre-wrap; }
  .history-card .copy-btn {
    background: none; border: 1px solid #e3c1ae; color: #b5714e; border-radius: 999px;
    font-size: 11px; padding: 3px 10px; cursor: pointer;
  }
  .history-card .copy-btn:hover { background: #fff0e6; }
  .drawer-empty { text-align: center; color: var(--ink-soft); padding: 60px 20px; line-height: 2; }
  .clear-history { background: none; border: none; color: #c9a08a; font-size: 12px; cursor: pointer; text-decoration: underline; margin-top: 8px; }

  footer { text-align: center; margin-top: 40px; color: #c4a794; font-size: 13px; }

  @media (max-width: 980px) { .bottle-zone, .result-zone { width: 100%; } }
</style>
</head>
<body>
<span class="float-deco" style="left:6%;top:14%;animation-delay:0s">🌸</span>
<span class="float-deco" style="left:88%;top:10%;animation-delay:1.2s">☁️</span>
<span class="float-deco" style="left:12%;top:70%;animation-delay:2s">🍄</span>
<span class="float-deco" style="left:92%;top:60%;animation-delay:.6s">⭐</span>
<span class="float-deco" style="left:78%;top:88%;animation-delay:1.6s">🎀</span>
<span class="float-deco" style="left:4%;top:42%;animation-delay:2.4s">🍃</span>

<div class="wrap">
  <header>
    <h1><span class="tilt">🫙</span> 手账灵感瓶 <span class="tilt" style="transform:rotate(5deg)">✨</span></h1>
    <p class="subtitle">选好想要的<strong>元素类型</strong>，摇一摇瓶子 —— 只给一点<strong>风格 + 模糊的小元素</strong>，画面留给你自由发挥 🎨</p>
  </header>

  <div class="main">
    <!-- 瓶子 -->
    <div class="bottle-zone">
      <h2>我的灵感瓶</h2>
      <p class="hint">点瓶子可以打开历史灵感 ✧ 最多存 100 张纸条</p>

      <div class="cat-title">想要哪类小元素？<small>（可多选）</small></div>
      <div class="cat-grid" id="catGrid"></div>

      <div class="cat-title">想要几个元素？<small>（1~8 个）</small></div>
      <div class="cat-grid" id="countGrid"></div>

      <div class="bottle-stage" id="bottleStage">
        <svg id="bottleSvg" width="170" height="232" viewBox="0 0 220 300">
          <g>
            <rect x="88" y="4" width="44" height="30" rx="9" fill="#c98850"/>
            <rect x="94" y="10" width="32" height="7" rx="3.5" fill="#e0a86e"/>
          </g>
          <rect x="84" y="32" width="52" height="22" rx="6" fill="#dceef5" stroke="#a9cfdd" stroke-width="2"/>
          <path d="M 84 52 L 84 72 C 84 84 48 100 42 136 C 36 170 40 250 52 268 C 62 284 158 284 168 268 C 180 250 184 170 178 136 C 172 100 136 84 136 72 L 136 52 Z"
                fill="rgba(190,228,242,.45)" stroke="#9cc9da" stroke-width="3"/>
          <path d="M 62 124 C 58 158 58 226 64 262" stroke="rgba(255,255,255,.85)" stroke-width="8" stroke-linecap="round" fill="none"/>
          <path d="M 76 118 C 73 152 73 210 77 252" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round" fill="none"/>
          <ellipse cx="110" cy="271" rx="56" ry="7" fill="rgba(150,200,220,.4)"/>
          <g transform="rotate(-4 110 195)">
            <rect x="76" y="164" width="68" height="72" rx="10" fill="#fffdf5" stroke="#f0b6c4" stroke-width="2"/>
            <text x="110" y="194" text-anchor="middle" font-size="18">🌸</text>
            <text x="110" y="218" text-anchor="middle" font-size="13" fill="#e0517a" font-weight="bold">灵感瓶</text>
            <text x="110" y="231" text-anchor="middle" font-size="9" fill="#c9a08a">inspiration</text>
          </g>
        </svg>
      </div>
      <button class="btn btn-shake" id="shakeBtn">🍹 摇一摇瓶子</button>

  "让其中一个小元素掉在画面外面，暗示它刚刚滚过去",
];
const MOODS = ["慵懒的", "元气满满的", "安静治愈的", "古灵精怪的", "梦幻柔软的", "俏皮活泼的", "怀旧温柔的", "带一点点孤独感的"];

/* ================= 核心逻辑 ================= */
const CATS_KEY = "journal-bottle-cats";
const STORE_KEY = "journal-inspiration-bottle-history";
const MAX_HISTORY = 100;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const copy = [...arr], out = [];
  while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  return out;
}

function getSelectedCats() {
  try {
    const saved = JSON.parse(localStorage.getItem(CATS_KEY));
    if (Array.isArray(saved) && saved.length) return saved;
  } catch {}
  return [...CATS];
}
function saveCats(cats) { localStorage.setItem(CATS_KEY, JSON.stringify(cats)); }

/* ================= 自定义元素 ================= */
const CUSTOM_KEY = "journal-bottle-custom";
const MAX_CUSTOM_PER_CAT = 100;

/* 生成元素数量设置 */
const COUNT_KEY = "journal-bottle-count";
const MIN_COUNT = 1, MAX_COUNT = 8;
function getCount() {
  const n = Number(localStorage.getItem(COUNT_KEY));
  return (n >= MIN_COUNT && n <= MAX_COUNT) ? n : 3;
}
function saveCount(n) { localStorage.setItem(COUNT_KEY, String(n)); }

function loadCustom() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; } catch { return {}; }
}
function saveCustom(obj) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(obj)); }

/* 某个类型的完整元素池 = 内置 + 自定义 */
function poolFor(cat) {
  const custom = loadCustom()[cat] || [];
  return ELEMENT_LIB[cat].concat(custom);
}

/* 给元素加合适的形容词（已有的修饰就跳过，留一部分不加，保持呼吸感） */
function decorate(word, cat) {
  if (/^[一两两三几半]/.test(word)) return word;         // 自带数量词的不加
  if (word.slice(0, 5).includes("的")) return word;        // 自带修饰的不加
  if (Math.random() < 0.3) return word;                    // 三成不加，避免太满
  const pool = (ADJ[cat] || []).concat(ADJ_ANY);
  return pick(pool) + word;
}

/* 按用户选的数量抽取元素：每个选中类型尽量都出现，再补足到指定个数 */
function buildElems(cats, n) {
  const out = [], seen = new Set(), catOf = new Map();
  const add = (raw, cat) => {
    if (!raw || seen.has(raw)) return false;
    seen.add(raw); out.push(raw); catOf.set(raw, cat); return true;
  };
  const lead = cats.length > n ? pickN(cats, n) : cats.slice();
  lead.forEach(c => add(pick(poolFor(c)), c));

  let guard = 0;
  while (out.length < n && guard++ < 400) add(pick(poolFor(pick(cats))), pick(cats));
  guard = 0;
  while (out.length < n && guard++ < 100) {           // 词库不足时允许重复
    const c = pick(cats); out.push(pick(poolFor(c))); catOf.set(out[out.length - 1], c);
  }
  return { words: out.sort(() => Math.random() - .5), catOf };
}

function generate() {
  const cats = getSelectedCats();
  const n = getCount();
  const style = pick(STYLES);
  const mood = pick(MOODS);
  const tip = pick(TIPS);

  const { words, catOf } = buildElems(cats, n);
  const customWords = new Set(Object.values(loadCustom()).flat());
  const elems = words.map(raw => {
    const text = decorate(raw, catOf.get(raw));
    return customWords.has(raw) ? "✦" + text : text;     // 自定义元素标上 ✦
  });

  const desc =
    `风格：${style.name}（${style.tag}）\n` +
    `内容：${elems.join("、")} 等\n` +
    `氛围：${mood}\n` +
    `小提示：${tip}~`;

  return {
    id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    time: new Date().toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }),
    tags: [
      { text: `${style.emoji} ${style.name}`, cls: "pink" },
      { text: `🌈 ${mood}`, cls: "mint" },
      ...cats.map(c => ({ text: `${CAT_EMOJI[c]} ${c}`, cls: CATS.indexOf(c) % 2 ? "lilac" : "blue" })),
    ],
    desc,
    short: `${style.name}\n${elems[0]}${elems[1] ? " " + elems[1] : ""}`,
  };
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
}
function saveHistory(list) { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, MAX_HISTORY))); }

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
let currentIdea = null;

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function sparkles(x, y) {
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = pick(["✨", "⭐", "💫", "🌟"]);
    s.style.left = x + (Math.random() * 80 - 40) + "px";
    s.style.top = y + (Math.random() * 60 - 30) + "px";
    s.style.fontSize = 12 + Math.random() * 12 + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

function renderTags(tags) {
  $("tagRow").innerHTML = tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join("");
}

function showResult(idea) {
  currentIdea = idea;
  renderTags(idea.tags);
  $("descText").innerHTML = idea.desc.replace(/</g, "&lt;").replace(/\n/g, "<br>")
    .replace(/^(风格|内容|氛围|小提示)：/gm, '<span class="line-label">$1：</span>');
  $("emptyTip").style.display = "none";
  const card = $("resultCard");
  card.classList.remove("show");
  void card.offsetWidth;
  card.classList.add("show");
}

/* ================= 纸条布局：摆在瓶子左右两侧的空白处 ================= */
const STRIP_COLORS = ["#fff8dc", "#ffe4ec", "#e2f4e8", "#e3eefb", "#f0e6fb"];
const BOTTLE_W = 170;            // 与 svg 宽度保持一致
const COMPACT_AT = 20;           // 超过这个数量纸条改为精简样式

function updateBottleCount() {
  const n = loadHistory().length;
  $("bottleCount").innerHTML = `🫙 瓶中已有 <b>${n}</b> / ${MAX_HISTORY} 张纸条`;
}

function layoutStrips(animateId) {
  const stage = $("bottleStage");
  if (!stage) return;
  stage.querySelectorAll(".strip-in-bottle").forEach(e => e.remove());

  const list = loadHistory().slice().reverse();      // 旧 → 新
  const total = list.length;
  updateBottleCount();
  if (!total) { stage.style.height = ""; return; }

  const stageW = stage.clientWidth || 422;
  const compact = total > COMPACT_AT;
  const perSide = Math.max(1, Math.ceil(total / 2));
  // 纸条变多时瓶身区一起变高，避免堆成一团
  const stageH = Math.min(720, Math.max(340, perSide * 26 + 40));
  stage.style.height = stageH + "px";

  // 左右两条空白列（瓶子本身占中间 BOTTLE_W 宽，纸条不压在瓶子上）
  const colL = { x0: 6, x1: (stageW - BOTTLE_W) / 2 - 8 };
  const colR = { x0: (stageW + BOTTLE_W) / 2 + 8, x1: stageW - 6 };
  const slotH = Math.max(11, (stageH - 24) / perSide);
  const used = { l: 0, r: 0 };
  const startLeft = Math.random() < 0.5;

  list.forEach((idea, idx) => {
    // 左右交替摆放，偶尔随机打乱，两侧都有
    let side = (idx % 2 === 0) === startLeft ? "l" : "r";
    if (Math.random() < 0.12) side = side === "l" ? "r" : "l";
    const col = side === "l" ? colL : colR;
    const colW = Math.max(40, col.x1 - col.x0);
    const width = Math.round(Math.min(
      compact ? 76 : 98,
      Math.max(compact ? 44 : 52, colW * (compact ? 0.66 : 0.84))
    ));

    const el = document.createElement("div");
    el.className = "strip-in-bottle" + (idea.done ? " done" : "") + (compact ? " compact" : "");
    el.dataset.ideaId = idea.id;
    el.style.background = pick(STRIP_COLORS);
    el.textContent = compact ? idea.short.split("\n")[0] : idea.short;
    el.title = "点击查看这张灵感";
    el.style.width = width + "px";

    const k = used[side]++;
    const left = col.x0 + Math.random() * Math.max(0, colW - width);
    const bottom = 10 + k * slotH + Math.random() * Math.max(2, slotH * 0.4);
    el.style.left = Math.round(left) + "px";
    el.style.bottom = Math.round(bottom) + "px";
    el.style.transform = `rotate(${(side === "l" ? -1 : 1) * (4 + Math.random() * 12)}deg)`;
    el.style.zIndex = String(1 + Math.floor(Math.random() * 5));
    el.onclick = () => { showResult(idea); sparkles(window.innerWidth / 2, window.innerHeight / 2); };

    if (animateId && idea.id === animateId) el.classList.add("strip-fly");
    stage.appendChild(el);
  });

  if (animateId) setTimeout(() => {
    const t = stage.querySelector(".strip-fly");
    if (t) t.classList.remove("strip-fly");
  }, 1000);
}

/* 兼容旧调用：重建全部纸条 */
function rebuildBottleStrips() { layoutStrips(); }

function doShake() {
  const svg = $("bottleSvg");
  svg.classList.add("shaking");
  setTimeout(() => svg.classList.remove("shaking"), 650);

  setTimeout(() => {
    const idea = generate();
    currentIdea = idea;
    showResult(idea);
    const list = loadHistory();
    list.unshift(idea);
    saveHistory(list);
    layoutStrips(idea.id);
    sparkles(window.innerWidth * 0.28, window.innerHeight * 0.45);
    const full = list.length >= MAX_HISTORY;
    showToast(full
      ? "✨ 纸条飘到瓶子旁边啦（已满 100 张，最旧的会被挤掉）"
      : "✨ 一张新的灵感纸条飘到瓶子旁边啦！");
  }, 550);
}

/* 元素类型选择器 */
function renderCats() {
  const selected = getSelectedCats();
  $("catGrid").innerHTML = CATS.map(c =>
    `<span class="cat-chip ${selected.includes(c) ? "on" : ""}" data-cat="${c}">${CAT_EMOJI[c]} ${c}</span>`
  ).join("");
  $("catGrid").querySelectorAll(".cat-chip").forEach(chip => {
    chip.onclick = () => {
      let sel = getSelectedCats();
      const c = chip.dataset.cat;
      if (sel.includes(c)) {
        sel = sel.filter(x => x !== c);
        if (!sel.length) { showToast("至少要留一种元素类型哦 🥺"); return; }
      } else sel.push(c);
      saveCats(sel);
      renderCats();
    };
  });
}

/* 元素数量选择器 */
function renderCountGrid() {
  const cur = getCount();
  const nums = [];
  for (let i = MIN_COUNT; i <= MAX_COUNT; i++) nums.push(i);
  $("countGrid").innerHTML = nums.map(n =>
    `<span class="num-chip ${n === cur ? "on" : ""}" data-n="${n}">${n}</span>`
  ).join("");
  $("countGrid").querySelectorAll(".num-chip").forEach(chip => {
    chip.onclick = () => {
      saveCount(Number(chip.dataset.n));
      renderCountGrid();
      showToast(`每次会生成 ${chip.dataset.n} 个元素 ✨`);
    };
  });
}

/* 元素库弹窗 + 自定义元素管理 */
let curElemCat = CATS[0];

function openElemModal() { renderElemTab(); $("elemModal").classList.add("show"); $("elemMask").classList.add("show"); }
function closeElemModal() { $("elemModal").classList.remove("show"); $("elemMask").classList.remove("show"); }

function initElemModal() {
  $("elemTabs").innerHTML = CATS.map(c =>
    `<span class="elem-tab" data-cat="${c}">${CAT_EMOJI[c]} ${c}</span>`
  ).join("");
  $("elemTabs").querySelectorAll(".elem-tab").forEach(tab => {
    tab.onclick = () => {
      $("elemTabs").querySelectorAll(".elem-tab").forEach(t => t.classList.remove("on"));
      tab.classList.add("on");
      curElemCat = tab.dataset.cat;
      renderElemTab();
    };
  });
  $("customCat").innerHTML = CATS.map(c => `<option value="${c}">${CAT_EMOJI[c]} ${c}</option>`).join("");
}

function renderElemTab() {
  const cat = curElemCat;
  const builtIn = ELEMENT_LIB[cat] || [];
  const custom = loadCustom()[cat] || [];
  $("elemCount").textContent =
    `${CAT_EMOJI[cat]} ${cat}：内置 ${builtIn.length} 个 ＋ 自定义 ${custom.length} 个（✦ 金色标签可删除）`;
  $("elemList").innerHTML =
    custom.map((w, i) =>
      `<span class="elem-pill custom">✦ ${w.replace(/</g, "&lt;")}<button data-idx="${i}" title="删除">✕</button></span>`
    ).join("") +
    builtIn.map(w => `<span class="elem-pill">${w.replace(/</g, "&lt;")}</span>`).join("");
  $("elemList").querySelectorAll(".elem-pill.custom button").forEach(btn => {
    btn.onclick = () => {
      const obj = loadCustom();
      obj[curElemCat].splice(Number(btn.dataset.idx), 1);
      saveCustom(obj);
      renderElemTab();
      showToast("已删除这个自定义元素 🗑️");
    };
  });
}

function addCustomElem() {
  const input = $("customInput");
  const word = input.value.trim().replace(/[,，、]/g, " ");
  if (!word) { showToast("先输入一个元素词吧 ✏️"); return; }
  const cat = $("customCat").value;
  const obj = loadCustom();
  obj[cat] = obj[cat] || [];
  if (obj[cat].some(w => w === word)) { showToast("这个词已经在瓶子里啦 🥺"); return; }
  if (obj[cat].length >= MAX_CUSTOM_PER_CAT) { showToast("这个类型最多存 100 个自定义元素哦"); return; }
  obj[cat].push(word);
  saveCustom(obj);
  input.value = "";
  input.focus();
  // 如果当前正在看的正是这个分类，立刻能看到新元素
  if (cat === curElemCat) renderElemTab();
  showToast(`已加入「${cat}」：${word} ✨ 摇一摇就能摇出来啦`);
}

/* 历史抽屉 */
function openDrawer() { renderHistory(); $("drawer").classList.add("show"); $("drawerMask").classList.add("show"); }
function closeDrawer() { $("drawer").classList.remove("show"); $("drawerMask").classList.remove("show"); }

function renderHistory() {
  const list = loadHistory();
  const box = $("drawerList");
  if (!list.length) {
    box.innerHTML = `<div class="drawer-empty">🫙<br>瓶子里还空空的~<br>快去摇一摇收集第一张灵感纸条吧！</div>`;
    return;
  }
  box.innerHTML = list.map((item, i) => `
    <div class="history-card ${item.done ? "done" : ""}" data-idx="${i}">
      <div class="meta">
        <span>🗓️ ${item.time} ${item.done ? '<span class="done-badge">✅ 已完成</span>' : ""}</span>
        <button class="copy-btn" data-idx="${i}">📋 复制</button>
      </div>
      <div class="text">${item.desc.replace(/</g, "&lt;")}</div>
      <div class="btns">
        <button class="hbtn done-btn ${item.done ? "on" : ""}" data-idx="${i}">${item.done ? "↩️ 取消完成" : "✅ 已完成"}</button>
        <button class="hbtn shred-btn" data-idx="${i}">💥 粉碎纸条</button>
      </div>
    </div>
  `).join("") + `<div style="text-align:center"><button class="clear-history" id="clearBtn">🗑️ 清空所有纸条</button></div>`;

  box.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => navigator.clipboard.writeText(list[btn.dataset.idx].desc).then(() => showToast("已复制到剪贴板 📋"));
  });
  box.querySelectorAll(".done-btn").forEach(btn => {
    btn.onclick = () => toggleDone(Number(btn.dataset.idx));
  });
  box.querySelectorAll(".shred-btn").forEach(btn => {
    btn.onclick = () => shredStrip(Number(btn.dataset.idx));
  });
  const clearBtn = $("clearBtn");
  if (clearBtn) clearBtn.onclick = () => {
    if (confirm("确定要把瓶子里的所有灵感纸条都倒掉吗？此操作不可恢复哦 🥺")) {
      saveHistory([]);
      rebuildBottleStrips();
      renderHistory();
      showToast("瓶子已清空，等待新的灵感 ✨");
    }
  };
}

/* 标记已完成 / 取消完成 */
function toggleDone(idx) {
  const list = loadHistory();
  if (!list[idx]) return;
  list[idx].done = !list[idx].done;
  saveHistory(list);
  rebuildBottleStrips();
  renderHistory();
  showToast(list[idx].done ? "太棒啦，这张灵感画完了 🎉" : "已改回待画状态 ✏️");
}

/* 粉碎纸条（带动画） */
function shredStrip(idx) {
  const list = loadHistory();
  if (!list[idx]) return;
  const card = $("drawerList").querySelector(`.history-card[data-idx="${idx}"]`);
  if (!confirm("确定要粉碎这张纸条吗？粉碎后不可恢复哦 💥")) return;
  if (card) card.classList.add("shredding");
  setTimeout(() => {
    const rest = loadHistory();
    rest.splice(idx, 1);
    saveHistory(rest);
    rebuildBottleStrips();
    renderHistory();
    showToast("纸条已粉碎，碎碎平安 🧡");
  }, 460);
}


function copyCurrent() {
  if (!currentIdea) return;
  navigator.clipboard.writeText(currentIdea.desc).then(() => showToast("灵感已复制，快去画吧 ✏️"));
}

/* ================= 事件绑定 ================= */
$("shakeBtn").onclick = doShake;
$("againBtn").onclick = doShake;
$("copyBtn").onclick = copyCurrent;
$("openHistoryBtn").onclick = openDrawer;
$("drawerClose").onclick = closeDrawer;
$("drawerMask").onclick = closeDrawer;
$("bottleSvg").onclick = openDrawer;
$("viewElemsBtn").onclick = openElemModal;
$("elemClose").onclick = closeElemModal;
$("elemMask").onclick = closeElemModal;
$("customAdd").onclick = addCustomElem;
$("customInput").addEventListener("keydown", e => { if (e.key === "Enter") addCustomElem(); });

renderCats();
renderCountGrid();
initElemModal();
layoutStrips();
window.addEventListener("resize", () => layoutStrips());
</script>
